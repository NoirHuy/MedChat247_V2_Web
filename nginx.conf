server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Proxied to the backend container so the SPA can call same-origin
    # relative paths (/api/...) — no CORS, and cookies work as first-party.
    location /api/ {
        proxy_pass http://backend:4000;
        proxy_http_version 1.1;
        
        # CRITICAL: Disable ALL buffering for streaming responses
        proxy_buffering off;
        proxy_cache off;
        proxy_request_buffering off;
        
        # Increase timeouts for long-running chat requests
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 120s;
        
        # Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        
        # CRITICAL: Pass through streaming-related headers
        proxy_set_header X-Accel-Buffering no;

        # Prevent compression to avoid buffering
        proxy_set_header Accept-Encoding "";
        proxy_set_header X-Accel-Encoding "identity";
    }

    location = /health {
        proxy_pass http://backend:4000/health;
    }

    # SPA fallback so client-side routing (and hard refreshes) resolve to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
