[tool.ruff]
line-length = 120
target-version = "py311"
exclude = ["data", ".venv", "venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = [
  "E501", # line length is enforced by formatter settings, not a hard error here
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
